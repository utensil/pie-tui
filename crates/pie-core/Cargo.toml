[package]
name = "pie-core"
description = "Pure TUI logic: input events, text measurement, layout model, diff frames, themes. Zero I/O."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
icu_locale_core = { version = "=2.0.0", default-features = false }
icu_provider = { version = "=2.0.0", default-features = false }
icu_segmenter = { version = "=2.0.0", features = ["compiled_data"] }
unicode-segmentation = "=1.12.0"
unicode-width = "0.2"
regex = "1"

[dev-dependencies]
serde_json = "1"
