[workspace]
resolver = "2"
members = [
    "crates/pie-core",
    "crates/pie-term",
    "crates/pie-components",
    "crates/pie-app",
    "adapters/pie-napi",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/utensil/pie-tui"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
